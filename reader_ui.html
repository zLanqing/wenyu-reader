function hashDocument(text){
  let value=2166136261;

function annotationSnapshot(withImages=false){

  const items=window.MathJax?.startup?.document?.math;

    if(saved&&key===annotationKey&&generation===documentGeneration&&!annotationHistory.length){
      await renderAnnotatedHTML(saved);
    }
  }catch{$('annotation-status').textContent='未能读取本机批注';}
}
function setupAnnotations(){
  documentGeneration++;
  annotationHistory=[];selectionRange=null;$('annotation-menu').hidden=true;$('annotation-undo').disabled=true;
  const template=document.createElement('div');template.innerHTML=current.html;
  annotationImages=[...template.querySelectorAll('img')].map(img=>img.getAttribute('src')||'');
  template.querySelector('[data-reader-ink]')?.remove();
  const skeleton=stripImageData(template);
  annotationKey=hashDocument((current.source||current.name)+'\n'+skeleton);
  $('annotation-status').textContent='批注自动保存在本机';
  // 等待当前排版完成后再恢复批注，避免两个排版过程同时改DOM。
  restoreInk();typeset().then(()=>{renderInk();return loadAnnotations();});
}
window.addEventListener('pywebviewready',()=>{if(current)loadAnnotations();});
function showAnnotationMenu(){
  if(!current||laserActive||penActive||$('image-dialog').open)return;
  const selection=window.getSelection();
  if(!selection.rangeCount||selection.isCollapsed){$('annotation-menu').hidden=true;selectionRange=null;return;}
  const range=selection.getRangeAt(0);
  if(!$('paper').contains(range.startContainer)||!$('paper').contains(range.endContainer))return;
  if(range.startContainer.parentElement.closest('mjx-container')||range.endContainer.parentElement.closest('mjx-container'))return;
  selectionRange=range.cloneRange();
  const box=range.getBoundingClientRect(),menu=$('annotation-menu');menu.hidden=false;
  const left=Math.min(innerWidth-menu.offsetWidth-10,Math.max(10,box.left));
  const top=box.top>menu.offsetHeight+18?box.top-menu.offsetHeight-10:Math.min(innerHeight-menu.offsetHeight-10,box.bottom+10);
  menu.style.left=left+'px';menu.style.top=Math.max(10,top)+'px';
  $('annotation-undo').disabled=!annotationHistory.length;
}
document.addEventListener('pointerup',event=>{if(!event.target.closest?.('#annotation-menu'))setTimeout(showAnnotationMenu,0);});
document.addEventListener('keyup',event=>{if(event.key==='Shift'||event.key.startsWith('Arrow'))showAnnotationMenu();});
$('annotation-menu').addEventListener('pointerdown',event=>event.preventDefault());
function applyAnnotation(kind){
  const range=selectionRange;if(!range||range.collapsed)return;
  const walker=document.createTreeWalker($('paper'),NodeFilter.SHOW_TEXT,{
    acceptNode(node){return node.textContent.trim()&&!node.parentElement.closest('mjx-container,script,style')&&range.intersectsNode(node)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}
  });
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  if(!nodes.length)return;
  rememberAnnotation();
  for(const node of nodes){
    const start=node===range.startContainer?range.startOffset:0;
    const end=node===range.endContainer?range.endOffset:node.length;
    if(end<=start)continue;
    // 从每个文本节点内部切分，保留段落、链接、表格等原结构。
    const part=document.createRange();part.setStart(node,start);part.setEnd(node,end);
    const span=document.createElement('span');span.dataset.readerMark=kind;
    part.surroundContents(span);
  }
  window.getSelection().removeAllRanges();selectionRange=null;$('annotation-menu').hidden=true;
  saveAnnotations();
}
async function undoAnnotation(){
  if(!annotationHistory.length)return;
  const snapshot=annotationHistory.pop();
  await renderAnnotatedHTML(snapshot);
  selectionRange=null;$('annotation-menu').hidden=true;$('annotation-undo').disabled=!annotationHistory.length;
  saveAnnotations();
}
$('annotation-yellow').onclick=()=>applyAnnotation('highlight');
$('annotation-red').onclick=()=>applyAnnotation('red');
$('annotation-undo').onclick=undoAnnotation;
$('annotation-clear').onclick=()=>{
  if(!$('paper').querySelector('[data-reader-mark]'))return;
  rememberAnnotation();
  $('paper').querySelectorAll('[data-reader-mark]').forEach(span=>span.replaceWith(...span.childNodes));
  window.getSelection().removeAllRanges();selectionRange=null;$('annotation-menu').hidden=true;
  saveAnnotations();
};
$('annotation-close').onclick=()=>{$('annotation-menu').hidden=true;};

// 笔迹采用矢量路径，避免为整篇长文档创建巨幅位图。
let penActive=false,inkStrokes=[],inkDrawing=null,inkPointer=null;
const inkNS='http://www.w3.org/2000/svg';
function inkBlocks(){return [...$('paper').children].filter(el=>!el.classList.contains('ink-overlay')&&!el.hasAttribute('data-reader-ink'));}
function inkOverlay(){
  let overlay=$('paper').querySelector('.ink-overlay');
  if(overlay)return overlay;
  overlay=document.createElementNS(inkNS,'svg');overlay.classList.add('ink-overlay');
  overlay.setAttribute('aria-hidden','true');overlay.setAttribute('preserveAspectRatio','none');
  overlay.addEventListener('pointerdown',beginInk);
  overlay.addEventListener('pointermove',moveInk);
  overlay.addEventListener('pointerup',finishInk);
  overlay.addEventListener('pointercancel',finishInk);
  overlay.addEventListener('lostpointercapture',finishInk);
  $('paper').append(overlay);return overlay;
}
function inkPathData(stroke){
  const block=inkBlocks()[stroke.block];if(!block)return '';
  const paper=$('paper'),r=paper.getBoundingClientRect(),b=block.getBoundingClientRect();
  const scale=r.width/paper.offsetWidth;
  const points=stroke.points.map(([x,y])=>[((b.left-r.left)+x*b.width)/scale,((b.top-r.top)+y*b.height)/scale]);
  const path=points.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+','+y.toFixed(2)).join(' ');
  return points.length===1?path+' l.01,.01':path;
}
function renderInk(){
  const overlay=inkOverlay(),paper=$('paper');
  overlay.setAttribute('viewBox','0 0 '+paper.offsetWidth+' '+paper.offsetHeight);
  overlay.replaceChildren();
  for(const stroke of inkStrokes){
    const path=document.createElementNS(inkNS,'path');path.setAttribute('d',inkPathData(stroke));
    overlay.append(path);
  }
  $('ink-clear').disabled=!inkStrokes.length;$('ink-undo').disabled=!annotationHistory.length;
}
function restoreInk(){
  inkDrawing=null;inkPointer=null;
  const marker=$('paper').querySelector('[data-reader-ink]');
  inkStrokes=[];
  if(marker){
    try{
      const data=JSON.parse(marker.dataset.readerInk),count=inkBlocks().length;
      if(Array.isArray(data))inkStrokes=data.slice(0,300).filter(s=>s&&Number.isInteger(s.block)&&s.block>=0&&s.block<count&&Array.isArray(s.points)).map(s=>({
        block:s.block,points:s.points.slice(0,5000).filter(p=>Array.isArray(p)&&p.length===2&&p.every(n=>typeof n==='number'&&Number.isFinite(n)&&Math.abs(n)<1000))
      })).filter(s=>s.points.length);
    }catch{}
    marker.remove();
  }
  renderInk();
}
function setPen(active){
  if(!active)finishInk();
  if(active&&laserActive)setLaser(false);
  penActive=!!active&&!!current;
  document.body.classList.toggle('pen-active',penActive);
  $('pen-toggle').setAttribute('aria-pressed',String(penActive));
  $('pen-toggle').textContent=penActive?'画笔：开 · P':'画笔（P）';
  if(penActive){window.getSelection().removeAllRanges();selectionRange=null;$('annotation-menu').hidden=true;renderInk();}
  if(presenting)revealPresentationExit();
}
function inkPoint(event,stroke){
  const r=inkBlocks()[stroke.block].getBoundingClientRect();
  return [Math.round((event.clientX-r.left)/r.width*10000)/10000,Math.round((event.clientY-r.top)/r.height*10000)/10000];
}
function beginInk(event){
  if(!penActive||event.button!==0||inkDrawing)return;
  const overlay=event.currentTarget;
  overlay.style.pointerEvents='none';const target=document.elementFromPoint(event.clientX,event.clientY);overlay.style.removeProperty('pointer-events');
  const blocks=inkBlocks();let block=blocks.findIndex(el=>el===target||el.contains(target));
  if(block<0)block=blocks.findIndex(el=>el.getBoundingClientRect().bottom>event.clientY);
  if(block<0)block=blocks.length-1;
  if(block<0)return;
  event.preventDefault();event.stopPropagation();rememberAnnotation();
  inkDrawing={block,points:[]};inkDrawing.points.push(inkPoint(event,inkDrawing));
  inkStrokes.push(inkDrawing);inkPointer=event.pointerId;
  overlay.setPointerCapture(event.pointerId);renderInk();
}
function moveInk(event){
  if(!inkDrawing||event.pointerId!==inkPointer)return;
  event.preventDefault();const p=inkPoint(event,inkDrawing),last=inkDrawing.points.at(-1);
  const r=inkBlocks()[inkDrawing.block].getBoundingClientRect();
  if(Math.hypot((p[0]-last[0])*r.width,(p[1]-last[1])*r.height)<1.5)return;
  if(inkDrawing.points.length>=5000){finishInk();return;}
  inkDrawing.points.push(p);
  $('paper').querySelector('.ink-overlay path:last-child').setAttribute('d',inkPathData(inkDrawing));
}
function finishInk(event){
  if(!inkDrawing||(event&&event.pointerId!==inkPointer))return;
  if(event?.type==='pointerup')moveInk(event);
  if(!inkDrawing)return;
  const overlay=$('paper').querySelector('.ink-overlay'),pointer=inkPointer;
  inkDrawing=null;inkPointer=null;
  if(overlay?.hasPointerCapture(pointer))overlay.releasePointerCapture(pointer);
  saveAnnotations();renderInk();
}
$('pen-toggle').onclick=()=>setPen(!penActive);
$('ink-undo').onclick=undoAnnotation;
$('ink-clear').onclick=()=>{
  if(!inkStrokes.length)return;
  finishInk();rememberAnnotation();inkStrokes=[];renderInk();saveAnnotations();
};
new ResizeObserver(()=>{if(current&&!inkDrawing)renderInk();}).observe($('paper'));
window.addEventListener('resize',()=>{if(current&&!inkDrawing)renderInk();});

$('open-main').onclick=$('open-file').onclick=()=>openDocument('file');
if($('open-empty'))$('open-empty').onclick=()=>openDocument('file');
$('open-folder').onclick=()=>openDocument('folder');$('font-down').onclick=()=>setFont(-1);$('font-up').onclick=()=>setFont(1);$('print').onclick=()=>window.print();$('export').onclick=exportHTML;
$('menu').onclick=()=>{$('sidebar').classList.toggle('open');$('scrim').classList.toggle('visible');$('menu').setAttribute('aria-expanded',String($('sidebar').classList.contains('open')));};$('scrim').onclick=closeMenu;
$('image-dialog').addEventListener('close',()=>{$('laser-dot').hidden=true;document.body.append($('laser-dot'));});
$('close-image').onclick=()=>$('image-dialog').close();$('image-dialog').addEventListener('click',event=>{if(event.target===$('image-dialog'))$('image-dialog').close();});
$('mathjax-script').addEventListener('load',typeset);$('mathjax-script').addEventListener('error',()=>{if(current&&/\$|\\\(|\\\[/.test(current.html))toast('公式排版需要联网加载 MathJax；正文和本地图片可离线阅读。');});
if(offline){
  $('open-main').hidden=true;$('open-file').hidden=true;$('open-folder').hidden=true;document.querySelector('.section-label').textContent='独立阅读文件';$('open-hint').textContent='本地配图已包含在文件中，可随 HTML 一起分享。公式排版需要联网加载 MathJax。';
  const data=$('export-document');if(data)showDocument(JSON.parse(data.textContent));
}else{
  fetch('api/document').then(response=>response.json()).then(doc=>{if(doc)showDocument(doc);}).catch(()=>toast('无法连接本机阅读服务，请重新打开文阅。'));
  setInterval(()=>fetch('api/ping').catch(()=>{}),20000);
}
})();
</script>
