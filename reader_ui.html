<body>
<div class="scrim" id="scrim"></div>
<aside class="sidebar" id="sidebar" aria-label="阅读导航">
  <div class="brand"><span class="brand-icon">文</span><span>文阅</span></div>
  <div class="brand-caption">MARKDOWN READER</div>
  <h2 class="intro">把文件打开，<br>把注意力留给内容。</h2>
  <button class="primary" id="open-main"><span id="open-label">打开你的组会汇报</span><span aria-hidden="true">↗</span></button>
  <div class="section-label">打开本地文档</div>
  <button class="open-button" id="open-file">＋ 选择 MD / ZIP 文件</button>
  <button class="open-button" id="open-folder">▣ 选择含配图的文件夹</button>
  <p class="hint" id="open-hint">有配图时，推荐直接选择 ZIP 包，或选择包含 MD 和 assets 的完整文件夹。文件在本机读取，不会上传到云端。</p>
  <nav class="toc" id="toc" aria-label="章节目录"><span class="hint">打开文档后，这里会显示章节目录。</span></nav>
  <div class="sidebar-footer">专注阅读 · 清晰呈现</div>
</aside>
<div class="workspace">
  <header class="toolbar">
    <button class="mobile-menu" id="menu" aria-label="展开章节目录">☰</button>
    <div class="file-name" id="file-name"><span class="dot"></span><span id="file-label">尚未打开文档</span></div>
    <div class="toolbar-actions">
      <button class="tool" id="font-down" aria-label="缩小字号">A−</button>
      <button class="tool" id="font-up" aria-label="增大字号">A＋</button>
      <button class="tool" id="presentation" title="放映（F5），按 Esc 退出" aria-keyshortcuts="F5" aria-pressed="false" disabled>放映</button>
      <button class="tool" id="export" disabled>导出含图片 HTML</button>
      <button class="tool" id="print" disabled>打印</button>
    </div>
  </header>
  <main class="content-wrap">
    <div class="status"><span id="status" role="status">一份文档，一段安静的阅读时间。</span><span id="font-label">17 px</span></div>
    <div class="notice" id="notice" hidden></div>
    <article class="paper" id="paper">
      <div class="empty"><div class="empty-mark">文</div><h1>从一份好读的文档开始。</h1><p>打开 Markdown，带上它的配图。<br>论文、公式、表格和思路，都有合适的位置。</p><button class="primary empty-open" id="open-empty"><span>选择一份 Markdown / ZIP</span><span>↗</span></button></div>
    </article>
  </main>
</div>
<dialog id="image-dialog"><button class="close-image" id="close-image">关闭 ×</button><img id="large-image" alt=""><p id="image-caption"></p></dialog>
<div class="toast" id="toast" role="status"></div>
<div class="presentation-controls" id="presentation-controls" role="toolbar" aria-label="放映工具" hidden>
  <button id="zoom-out" title="缩小（Ctrl＋滚轮向下）" aria-label="缩小页面">−</button>
  <button id="zoom-reset" title="恢复100%（Ctrl＋0）">100%</button>
  <button id="zoom-in" title="放大（Ctrl＋滚轮向上）" aria-label="放大页面">＋</button>
  <button id="laser-toggle" title="激光笔开关（L）" aria-pressed="false">激光笔 · L</button>
  <button id="pen-toggle" title="按P开关画笔；按住鼠标左键拖动可留笔迹" aria-pressed="false">画笔 · P</button>
  <button id="ink-undo" title="撤销上一项笔迹或文字批注（Ctrl＋Z）" disabled>撤销</button>
  <button id="ink-clear" title="清除所有手写笔迹，可以撤销" disabled>清除笔迹</button>
  <button class="presentation-exit" id="presentation-exit">退出 · Esc</button>
</div>
<div class="laser-dot" id="laser-dot" aria-hidden="true" hidden></div>
<div class="annotation-menu" id="annotation-menu" role="toolbar" aria-label="文字批注" hidden>
  <div class="annotation-actions">
    <button id="annotation-yellow">黄色高亮</button><button id="annotation-red">文字标红</button>
    <button id="annotation-undo" title="撤销本次阅读中的上一项批注（Ctrl＋Z）" disabled>撤销</button>
    <button id="annotation-clear">清除批注</button><button id="annotation-close" aria-label="关闭批注工具">×</button>

</div>

<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const offline=document.documentElement.dataset.exported==='true';
let current=null, fontSize=parseInt(document.documentElement.style.getPropertyValue('--size'))||17, toastTimer, observer;
let presenting=false, presentationBusy=false, exitTimer;
const toast=message=>{ $('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').textContent='';},5500); };
function readingPosition(){
  if(window.scrollY<4)return null;
  const top=presenting?0:document.querySelector('.toolbar').getBoundingClientRect().height;
  const element=[...$('paper').querySelectorAll('h1,h2,h3,p,table,pre,ul,ol')].find(el=>el.getBoundingClientRect().bottom>top);
  return element?{element,offset:element.getBoundingClientRect().top-top}:null;
}
function restoreReadingPosition(position){
  requestAnimationFrame(()=>{
    const top=presenting?0:document.querySelector('.toolbar').getBoundingClientRect().height;
    if(position&&position.element.isConnected)window.scrollBy({top:position.element.getBoundingClientRect().top-top-position.offset,behavior:'instant'});
    else window.scrollTo({top:0,behavior:'instant'});
  });
}
function revealPresentationExit(){
  if(!presenting)return;
  document.body.classList.add('show-presentation-exit');clearTimeout(exitTimer);
  exitTimer=setTimeout(()=>document.body.classList.remove('show-presentation-exit'),2500);
}
async function setPresentation(active){
  if(!current||presentationBusy||active===presenting)return;
  presentationBusy=true;
  const position=readingPosition();
  try{
    const native=window.pywebview?.api?.set_presentation;
    if(native)await native(active);
    else if(active){
      if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();
    }else if(document.fullscreenElement){await document.exitFullscreen();}
    presenting=active;document.body.classList.toggle('presenting',active);if(!active){setLaser(false);setPen(false);}
    $('presentation').setAttribute('aria-pressed',String(active));$('presentation-controls').hidden=!active;
    closeMenu();
    if(active)revealPresentationExit();
    else{clearTimeout(exitTimer);document.body.classList.remove('show-presentation-exit');$('presentation').focus({preventScroll:true});}
    restoreReadingPosition(position);
  }catch{toast('无法切换放映模式，请重试。');}
  finally{presentationBusy=false;}
}
document.addEventListener('keydown',event=>{
  if(event.key==='F5'&&current){event.preventDefault();setPresentation(true);}
  else if(event.key==='Escape'&&presenting&&!$('image-dialog').open){event.preventDefault();setPresentation(false);}
});
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&presenting&&!window.pywebview?.api?.set_presentation)setPresentation(false);
});
document.addEventListener('pointermove',event=>{if(presenting&&event.clientY<70&&event.clientX>innerWidth-580)revealPresentationExit();});
$('presentation').onclick=()=>setPresentation(true);$('presentation-exit').onclick=()=>setPresentation(false);
function cleanHTML(source){
  const template=document.createElement('template');template.innerHTML=source;
  template.content.querySelectorAll('script,iframe,object,embed,link,meta,base,style,form,input,button,textarea,select,svg').forEach(el=>el.remove());
  template.content.querySelectorAll('*').forEach(el=>{
    for(const attr of [...el.attributes]){
      const name=attr.name.toLowerCase(),value=attr.value.replace(/[\s\x00-\x1f]/g,'').toLowerCase();
      if(name.startsWith('on')||['srcdoc','style','srcset','formaction'].includes(name)||(name==='href'&&!/^(https?:|mailto:|#)/i.test(value))||(name==='src'&&!/^(https?:|data:image\/(png|jpe?g|gif|webp|bmp|svg\+xml|x-icon|vnd\.microsoft\.icon);)/i.test(value))){el.removeAttribute(attr.name);}
    }
  });
  return template.innerHTML;
}
function closeMenu(){ $('sidebar').classList.remove('open');$('scrim').classList.remove('visible'); }
function buildTOC(){
  if(observer)observer.disconnect();
  const nav=$('toc');nav.replaceChildren();
  const headings=[...$('paper').querySelectorAll('h1,h2')];
  headings.forEach((heading,index)=>{
    if(!heading.id)heading.id='chapter-'+index;
    const link=document.createElement('a');link.href='#'+heading.id;link.textContent=heading.textContent;link.className='level-'+heading.tagName.slice(1);
    link.addEventListener('click',closeMenu);nav.append(link);
  });
  if(!headings.length)nav.textContent='这份文档没有章节标题。';
  const links=[...nav.querySelectorAll('a')];
  observer=new IntersectionObserver(entries=>{
    const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
    if(!visible.length)return;
    links.forEach(link=>link.classList.toggle('active',link.hash==='#'+visible[0].target.id));
  },{rootMargin:'-80px 0px -55% 0px',threshold:0});
  headings.forEach(heading=>observer.observe(heading));
  if(links[0])links[0].classList.add('active');
}
function markBrokenImages(){
  $('paper').querySelectorAll('img').forEach(img=>{
    const showError=()=>{
      const box=document.createElement('span');box.className='image-error';
      const title=document.createElement('span');title.textContent=img.alt||'图片暂时无法显示';
      const detail=document.createElement('small');detail.textContent=(img.dataset.originalSrc||'')+' · '+(img.dataset.imageError||'图片损坏或加载失败');
      box.append(title,detail);img.replaceWith(box);
    };
    if(img.dataset.imageError){showError();return;}
    img.addEventListener('error',showError,{once:true});

async function openDocument(action){

function setFont(delta){fontSize=Math.max(13,Math.min(24,fontSize+delta));document.documentElement.style.setProperty('--size',fontSize+'px');$('font-label').textContent=fontSize+' px';$('font-down').disabled=fontSize===13;$('font-up').disabled=fontSize===24;}

// 缩放、指示点及批注均在页面本地执行；只有批注操作触发保存。

function setLaser(active){

document.addEventListener('wheel',event=>{

},{passive:false});
document.addEventListener('keydown',event=>{

document.addEventListener('pointermove',event=>{
  if(!laserActive)return;
  const target=event.target;
  const allowed=target.closest('#paper,#image-dialog')&&!target.closest('button,a');
  $('laser-dot').hidden=!allowed;

document.addEventListener('pointerout',event=>{if(!event.relatedTarget)$('laser-dot').hidden=true;});

$('zoom-out').onclick=()=>setZoom(readingZoom-.1);

function hashDocument(text){
  let value=2166136261;
  for(let i=0;i<text.length;i++)value=Math.imul(value^text.charCodeAt(i),16777619);
  return (value>>>0).toString(16).padStart(8,'0');
}
function stripImageData(root){
  root.querySelectorAll('img').forEach((img,index)=>{
    img.setAttribute('data-reader-image',String(index));img.removeAttribute('src');
  });
  return root.innerHTML;
}
function restoreImageData(html){
  const template=document.createElement('template');template.innerHTML=cleanHTML(html);
  template.content.querySelectorAll('img[data-reader-image]').forEach(img=>{
    const index=Number(img.getAttribute('data-reader-image'));
    if(Number.isInteger(index)&&annotationImages[index])img.src=annotationImages[index];
    img.removeAttribute('data-reader-image');
  });
  return template.innerHTML;
}
function annotationSnapshot(withImages=false){
  const paper=$('paper'),clone=paper.cloneNode(true);
  // 将排版后的数学节点还原为原始TeX，导出/恢复时再排版，避免保存整套MathJax DOM。
  const items=window.MathJax?.startup?.document?.math;
  if(items)for(const item of items){
    let node=item.typesetRoot;
    if(!node||!paper.contains(node))continue;
    const path=[];
    while(node!==paper){path.unshift([...node.parentNode.childNodes].indexOf(node));node=node.parentNode;}
    let target=clone;for(const index of path)target=target.childNodes[index];
    const delimiter=item.display?'$$':'$';
    target.replaceWith(document.createTextNode(delimiter+item.math+delimiter));
  }
  clone.querySelector('.ink-overlay')?.remove();
  clone.querySelector('[data-reader-ink]')?.remove();
  if(inkStrokes.length){const marker=document.createElement('div');marker.hidden=true;marker.dataset.readerInk=JSON.stringify(inkStrokes);clone.append(marker);}
  return withImages?clone.innerHTML:stripImageData(clone);
}
async function annotationStorage(action,key,content){
  const api=window.pywebview?.api;
  if(api?.read_annotations&&api?.save_annotations){
    return action==='read'?api.read_annotations(key):api.save_annotations(key,content);
  }
  const storageKey='wenyu-annotations-v1:'+key;
  if(action==='read')return localStorage.getItem(storageKey)||'';
  localStorage.setItem(storageKey,content);return true;
}
function saveAnnotations(){
  const key=annotationKey,snapshot=annotationSnapshot();
  annotationSaveQueue=annotationSaveQueue.catch(()=>{}).then(()=>annotationStorage('write',key,snapshot)).then(()=>{
    $('annotation-status').textContent='批注已保存在本机';
  }).catch(()=>{$('annotation-status').textContent='未能自动保存，可导出含批注HTML';});
}
function rememberAnnotation(){
  annotationHistory.push(annotationSnapshot());
  if(annotationHistory.length>20)annotationHistory.shift();
  $('annotation-undo').disabled=false;$('ink-undo').disabled=false;
}
async function renderAnnotatedHTML(html){
  const y=scrollY;
  if(window.MathJax?.typesetClear)MathJax.typesetClear([$('paper')]);
  $('paper').innerHTML=restoreImageData(html);
  buildTOC();markBrokenImages();restoreInk();await typeset();renderInk();
  window.scrollTo({top:y,behavior:'instant'});
}
async function loadAnnotations(){
  const key=annotationKey,generation=documentGeneration;
  try{
    const saved=await annotationStorage('read',key);
    if(saved&&key===annotationKey&&generation===documentGeneration&&!annotationHistory.length){
      await renderAnnotatedHTML(saved);
    }
  }catch{$('annotation-status').textContent='未能读取本机批注';}
}
function setupAnnotations(){
  documentGeneration++;
  annotationHistory=[];selectionRange=null;$('annotation-menu').hidden=true;$('annotation-undo').disabled=true;
  const template=document.createElement('div');template.innerHTML=current.html;
  annotationImages=[...template.querySelectorAll('img')].map(img=>img.getAttribute('src')||'');
  template.querySelector('[data-reader-ink]')?.remove();

window.addEventListener('pywebviewready',()=>{if(current)loadAnnotations();});
function showAnnotationMenu(){

  if(!selection.rangeCount||selection.isCollapsed){$('annotation-menu').hidden=true;selectionRange=null;return;}
  const range=selection.getRangeAt(0);
  if(!$('paper').contains(range.startContainer)||!$('paper').contains(range.endContainer))return;
  if(range.startContainer.parentElement.closest('mjx-container')||range.endContainer.parentElement.closest('mjx-container'))return;

  const box=range.getBoundingClientRect(),menu=$('annotation-menu');menu.hidden=false;
  const left=Math.min(innerWidth-menu.offsetWidth-10,Math.max(10,box.left));

document.addEventListener('pointerup',event=>{if(!event.target.closest?.('#annotation-menu'))setTimeout(showAnnotationMenu,0);});
document.addEventListener('keyup',event=>{if(event.key==='Shift'||event.key.startsWith('Arrow'))showAnnotationMenu();});
$('annotation-menu').addEventListener('pointerdown',event=>event.preventDefault());
function applyAnnotation(kind){

    acceptNode(node){return node.textContent.trim()&&!node.parentElement.closest('mjx-container,script,style')&&range.intersectsNode(node)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}
  });

// 笔迹采用矢量路径，避免为整篇长文档创建巨幅位图。
let penActive=false,inkStrokes=[],inkDrawing=null,inkPointer=null;
const inkNS='http://www.w3.org/2000/svg';
function inkBlocks(){return [...$('paper').children].filter(el=>!el.classList.contains('ink-overlay')&&!el.hasAttribute('data-reader-ink'));}
function inkOverlay(){

}
function inkPathData(stroke){

  const points=stroke.points.map(([x,y])=>[((b.left-r.left)+x*b.width)/scale,((b.top-r.top)+y*b.height)/scale]);
  const path=points.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+','+y.toFixed(2)).join(' ');
  return points.length===1?path+' l.01,.01':path;

function renderInk(){

function restoreInk(){

  inkStrokes=[];
  if(marker){
    try{
      const data=JSON.parse(marker.dataset.readerInk),count=inkBlocks().length;
      if(Array.isArray(data))inkStrokes=data.slice(0,300).filter(s=>s&&Number.isInteger(s.block)&&s.block>=0&&s.block<count&&Array.isArray(s.points)).map(s=>({
        block:s.block,points:s.points.slice(0,5000).filter(p=>Array.isArray(p)&&p.length===2&&p.every(n=>typeof n==='number'&&Number.isFinite(n)&&Math.abs(n)<1000))
      })).filter(s=>s.points.length);
    }catch{}
    marker.remove();
  }

}
function setPen(active){
  if(!active)finishInk();
  if(active&&laserActive)setLaser(false);
  penActive=!!active&&!!current;
  document.body.classList.toggle('pen-active',penActive);
  $('pen-toggle').setAttribute('aria-pressed',String(penActive));
  $('pen-toggle').textContent=penActive?'画笔：开 · P':'画笔 · P';
  if(penActive){window.getSelection().removeAllRanges();selectionRange=null;$('annotation-menu').hidden=true;renderInk();}
  if(presenting)revealPresentationExit();
}
function inkPoint(event,stroke){
  const r=inkBlocks()[stroke.block].getBoundingClientRect();
  return [Math.round((event.clientX-r.left)/r.width*10000)/10000,Math.round((event.clientY-r.top)/r.height*10000)/10000];
}
function beginInk(event){

  overlay.style.pointerEvents='none';const target=document.elementFromPoint(event.clientX,event.clientY);overlay.style.removeProperty('pointer-events');
  const blocks=inkBlocks();let block=blocks.findIndex(el=>el===target||el.contains(target));
  if(block<0)block=blocks.findIndex(el=>el.getBoundingClientRect().bottom>event.clientY);

  if(block<0)return;
  event.preventDefault();event.stopPropagation();rememberAnnotation();
  inkDrawing={block,points:[]};inkDrawing.points.push(inkPoint(event,inkDrawing));

function moveInk(event){
  if(!inkDrawing||event.pointerId!==inkPointer)return;
  event.preventDefault();const p=inkPoint(event,inkDrawing),last=inkDrawing.points.at(-1);
  const r=inkBlocks()[inkDrawing.block].getBoundingClientRect();
  if(Math.hypot((p[0]-last[0])*r.width,(p[1]-last[1])*r.height)<1.5)return;
  if(inkDrawing.points.length>=5000){finishInk();return;}
  inkDrawing.points.push(p);
  $('paper').querySelector('.ink-overlay path:last-child').setAttribute('d',inkPathData(inkDrawing));
}
function finishInk(event){

  inkDrawing=null;inkPointer=null;
  if(overlay?.hasPointerCapture(pointer))overlay.releasePointerCapture(pointer);
  saveAnnotations();renderInk();
}
$('pen-toggle').onclick=()=>setPen(!penActive);
$('ink-undo').onclick=undoAnnotation;
$('ink-clear').onclick=()=>{
  if(!inkStrokes.length)return;
  finishInk();rememberAnnotation();inkStrokes=[];renderInk();saveAnnotations();
};
new ResizeObserver(()=>{if(current&&!inkDrawing)renderInk();}).observe($('paper'));

if($('open-empty'))$('open-empty').onclick=()=>openDocument('file');
$('open-folder').onclick=()=>openDocument('folder');$('font-down').onclick=()=>setFont(-1);$('font-up').onclick=()=>setFont(1);$('print').onclick=()=>window.print();$('export').onclick=exportHTML;
$('menu').onclick=()=>{$('sidebar').classList.toggle('open');$('scrim').classList.toggle('visible');};$('scrim').onclick=closeMenu;
$('image-dialog').addEventListener('close',()=>{$('laser-dot').hidden=true;document.body.append($('laser-dot'));});
$('close-image').onclick=()=>$('image-dialog').close();$('image-dialog').addEventListener('click',event=>{if(event.target===$('image-dialog'))$('image-dialog').close();});
$('mathjax-script').addEventListener('load',typeset);$('mathjax-script').addEventListener('error',()=>{if(current&&/\$|\\\(|\\\[/.test(current.html))toast('公式排版需要联网加载 MathJax；正文和本地图片可离线阅读。');});
if(offline){
  $('open-main').hidden=true;$('open-file').hidden=true;$('open-folder').hidden=true;document.querySelector('.section-label').textContent='独立阅读文件';$('open-hint').textContent='本地配图已包含在文件中，可随 HTML 一起分享。公式排版需要联网加载 MathJax。';
  const data=$('export-document');if(data)showDocument(JSON.parse(data.textContent));
}else{
  fetch('api/document').then(response=>response.json()).then(doc=>{if(doc)showDocument(doc);}).catch(()=>toast('无法连接本机阅读服务，请重新打开文阅。'));
  setInterval(()=>fetch('api/ping').catch(()=>{}),20000);
}
